<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Defender - HTML5 Game</title>
    <meta name="description" content="Defend Earth from alien invaders in this action-packed space shooter!">
    <meta name="keywords" content="space game, shooter, html5 game, arcade, aliens">

    <!-- CrazyGames SDK -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            border: 2px solid #333;
            background: radial-gradient(circle, #001122 0%, #000000 100%);
        }

        canvas {
            display: block;
            background: transparent;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0,0,0,0.8);
            padding: 30px;
            border: 2px solid #fff;
            border-radius: 10px;
            display: none;
            z-index: 20;
        }

        button {
            background: #0066cc;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
            border-radius: 5px;
            font-family: inherit;
        }

        button:hover {
            background: #0088ff;
        }

        #muteBtn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 10;
            padding: 8px 14px;
            font-size: 14px;
            margin: 0;
        }

        #fuelBar {
            position: absolute;
            bottom: 10px;
            left: 10px;
            z-index: 10;
            font-size: 14px;
        }

        #fuelBarInner {
            display: inline-block;
            width: 100px;
            height: 12px;
            background: #333;
            border: 1px solid #666;
            vertical-align: middle;
            margin-left: 6px;
            border-radius: 3px;
            overflow: hidden;
        }

        #fuelFill {
            height: 100%;
            width: 100%;
            background: #00aaff;
            transition: width 0.1s;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="ui">
            <div>SCORE: <span id="score">0</span></div>
            <div>HI: <span id="highScore">0</span></div>
            <div>LIVES: <span id="lives">3</span></div>
            <div>LEVEL: <span id="level">1</span></div>
            <div>RES: <span id="resources">0</span></div>
        </div>
        <div id="fuelBar">FUEL: <span id="fuelBarInner"><span id="fuelFill"></span></span></div>
        <button id="muteBtn">MUTE</button>
        <div id="gameOver">
            <h2 id="gameOverTitle">GAME OVER</h2>
            <p>Score: <span id="finalScore">0</span></p>
            <p>High Score: <span id="finalHighScore">0</span></p>
            <br>
            <button id="restartBtn">PLAY AGAIN</button>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        // CrazyGames SDK helpers
        const SDK = {
            init: async () => {
                if (window.CrazyGames) {
                    try { await window.CrazyGames.SDK.init(); } catch(e) {}
                }
            },
            gameplayStart: () => { try { window.CrazyGames?.SDK.game.gameplayStart(); } catch(e) {} },
            gameplayStop: () => { try { window.CrazyGames?.SDK.game.gameplayStop(); } catch(e) {} },
            loadingStart: () => { try { window.CrazyGames?.SDK.game.loadingStart(); } catch(e) {} },
            loadingStop: () => { try { window.CrazyGames?.SDK.game.loadingStop(); } catch(e) {} },
            happytime: () => { try { window.CrazyGames?.SDK.game.happytime(); } catch(e) {} }
        };

        // Audio
        let audioCtx = null;
        let isMuted = false;

        function initAudio() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch(e) {}
        }

        function playSound(freq, duration, type = 'sine', vol = 0.3) {
            if (!audioCtx || isMuted) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            osc.type = type;
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // Canvas setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const W = 800, H = 600;
        canvas.width = W;
        canvas.height = H;

        // Scale container
        const container = document.getElementById('gameContainer');
        function resize() {
            const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
            container.style.width = W + 'px';
            container.style.height = H + 'px';
            container.style.transform = `scale(${scale})`;
            container.style.transformOrigin = 'center center';
        }
        window.addEventListener('resize', resize);
        resize();

        // Game state
        let state = {};
        let bullets = [];
        let asteroids = [];
        let particles = [];
        let stars = [];
        let keys = {};
        let animId = null;
        let lastTime = 0;
        let shootCooldown = 0;
        let invincibleTimer = 0;
        let gameRunning = false;
        let highScore = parseInt(localStorage.getItem('spaceDefenderHiScore') || '0');

        function initStars() {
            stars = [];
            for (let i = 0; i < 120; i++) {
                stars.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    r: Math.random() * 1.5 + 0.3,
                    alpha: Math.random() * 0.7 + 0.3
                });
            }
        }

        function initGame() {
            state = {
                score: 0,
                level: 1,
                lives: 3,
                resources: 0,
                fuel: 100,
                maxFuel: 100,
                player: {
                    x: W / 2, y: H / 2,
                    vx: 0, vy: 0,
                    angle: 0,
                    thrusting: false
                }
            };
            bullets = [];
            asteroids = [];
            particles = [];
            shootCooldown = 0;
            invincibleTimer = 1500; // brief invincibility on start
            spawnAsteroids(state.level);
            updateUI();
        }

        function spawnAsteroids(level) {
            const count = 3 + level * 2;
            for (let i = 0; i < count; i++) {
                spawnAsteroid();
            }
        }

        function spawnAsteroid(x, y, size) {
            // Keep away from player on initial spawn
            if (x === undefined) {
                do {
                    x = Math.random() * W;
                    y = Math.random() * H;
                } while (dist(x, y, state.player.x, state.player.y) < 120);
            }
            size = size || (Math.random() < 0.5 ? 40 : 25);
            const speed = (1 + state.level * 0.3) * (0.5 + Math.random());
            const angle = Math.random() * Math.PI * 2;
            const resources = size > 30 ? Math.floor(Math.random() * 3) : 0;
            asteroids.push({ x, y, size, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, angle: 0, rotSpeed: (Math.random() - 0.5) * 2, resources, hp: size > 30 ? 2 : 1 });
        }

        function dist(x1, y1, x2, y2) {
            return Math.hypot(x2 - x1, y2 - y1);
        }

        function spawnParticle(x, y, color, count = 8) {
            for (let i = 0; i < count; i++) {
                const speed = 1 + Math.random() * 3;
                const angle = Math.random() * Math.PI * 2;
                particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 1, color });
            }
        }

        function updateUI() {
            document.getElementById('score').textContent = state.score;
            document.getElementById('highScore').textContent = highScore;
            document.getElementById('lives').textContent = state.lives;
            document.getElementById('level').textContent = state.level;
            document.getElementById('resources').textContent = state.resources;
            const fuelPct = (state.fuel / state.maxFuel * 100).toFixed(0);
            document.getElementById('fuelFill').style.width = fuelPct + '%';
        }

        function shoot() {
            if (shootCooldown > 0) return;
            const p = state.player;
            bullets.push({ x: p.x + Math.sin(p.angle) * 20, y: p.y - Math.cos(p.angle) * 20, vx: Math.sin(p.angle) * 10, vy: -Math.cos(p.angle) * 10, life: 1 });
            playSound(800, 0.15, 'square', 0.15);
            shootCooldown = 150;
        }

        function update(dt) {
            const p = state.player;

            // Cooldowns
            if (shootCooldown > 0) shootCooldown -= dt;
            if (invincibleTimer > 0) invincibleTimer -= dt;

            // Rotation
            const rotSpeed = 0.003;
            if (keys['ArrowLeft'] || keys['KeyA']) p.angle -= rotSpeed * dt;
            if (keys['ArrowRight'] || keys['KeyD']) p.angle += rotSpeed * dt;

            // Thrust
            p.thrusting = (keys['ArrowUp'] || keys['KeyW']) && state.fuel > 0;
            if (p.thrusting) {
                p.vx += Math.sin(p.angle) * 0.2;
                p.vy -= Math.cos(p.angle) * 0.2;
                state.fuel = Math.max(0, state.fuel - 0.03 * dt);
                if (Math.random() < 0.3) {
                    spawnParticle(p.x - Math.sin(p.angle) * 15, p.y + Math.cos(p.angle) * 15, '#ff6600', 1);
                }
                playSound(60, 0.05, 'sawtooth', 0.05);
            } else {
                state.fuel = Math.min(state.maxFuel, state.fuel + 0.01 * dt);
            }

            // Cap speed
            const speed = Math.hypot(p.vx, p.vy);
            if (speed > 6) { p.vx = p.vx / speed * 6; p.vy = p.vy / speed * 6; }

            // Drag
            p.vx *= 0.99;
            p.vy *= 0.99;

            // Move player
            p.x = (p.x + p.vx + W) % W;
            p.y = (p.y + p.vy + H) % H;

            // Shoot
            if (keys['Space'] || keys['KeyZ'] || keys['KeyX']) shoot();

            // Bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.x = (b.x + b.vx + W) % W;
                b.y = (b.y + b.vy + H) % H;
                b.life -= 0.008 * dt;
                if (b.life <= 0) { bullets.splice(i, 1); continue; }

                // Bullet-asteroid collision
                for (let j = asteroids.length - 1; j >= 0; j--) {
                    const a = asteroids[j];
                    if (dist(b.x, b.y, a.x, a.y) < a.size) {
                        bullets.splice(i, 1);
                        a.hp--;
                        spawnParticle(b.x, b.y, '#ff4400', 5);
                        if (a.hp <= 0) {
                            state.score += a.size > 30 ? 100 : 50;
                            if (a.resources > 0) { state.resources += a.resources; playSound(800, 0.3, 'sine', 0.2); }
                            playSound(150, 0.4, 'square', 0.2);
                            spawnParticle(a.x, a.y, '#ff8800', 15);
                            if (a.size > 30) {
                                spawnAsteroid(a.x, a.y, 20);
                                spawnAsteroid(a.x, a.y, 20);
                            }
                            asteroids.splice(j, 1);
                            if (state.score > highScore) { highScore = state.score; localStorage.setItem('spaceDefenderHiScore', highScore); }
                            SDK.happytime();
                        }
                        updateUI();
                        break;
                    }
                }
            }

            // Asteroids
            for (const a of asteroids) {
                a.x = (a.x + a.vx + W) % W;
                a.y = (a.y + a.vy + H) % H;
                a.angle += a.rotSpeed * 0.001 * dt;

                // Player collision
                if (invincibleTimer <= 0 && dist(p.x, p.y, a.x, a.y) < a.size + 14) {
                    state.lives--;
                    invincibleTimer = 2000;
                    playSound(200, 0.5, 'square', 0.3);
                    spawnParticle(p.x, p.y, '#ffffff', 20);
                    updateUI();
                    if (state.lives <= 0) { endGame(); return; }
                }
            }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const pt = particles[i];
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.life -= 0.002 * dt;
                pt.vx *= 0.97;
                pt.vy *= 0.97;
                if (pt.life <= 0) particles.splice(i, 1);
            }

            // Level complete
            if (asteroids.length === 0) {
                state.level++;
                invincibleTimer = 1000;
                playSound(1000, 1.0, 'sine', 0.3);
                spawnAsteroids(state.level);
                updateUI();
            }

            updateUI();
        }

        function draw() {
            ctx.fillStyle = '#000010';
            ctx.fillRect(0, 0, W, H);

            // Stars
            for (const s of stars) {
                ctx.globalAlpha = s.alpha;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            // Particles
            for (const pt of particles) {
                ctx.globalAlpha = pt.life;
                ctx.fillStyle = pt.color;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 3, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            // Asteroids
            for (const a of asteroids) {
                ctx.save();
                ctx.translate(a.x, a.y);
                ctx.rotate(a.angle);
                ctx.strokeStyle = '#8B6914';
                ctx.fillStyle = '#5a3d0c';
                ctx.lineWidth = 2;
                ctx.beginPath();
                const pts = 8;
                for (let i = 0; i < pts; i++) {
                    const ang = (i / pts) * Math.PI * 2;
                    const r = a.size * (0.8 + Math.sin(i * 2.3) * 0.2);
                    if (i === 0) ctx.moveTo(Math.cos(ang) * r, Math.sin(ang) * r);
                    else ctx.lineTo(Math.cos(ang) * r, Math.sin(ang) * r);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                if (a.resources > 0) {
                    ctx.strokeStyle = '#00ffff';
                    ctx.lineWidth = 1;
                    for (let i = 0; i < a.resources; i++) {
                        const ang = (i / a.resources) * Math.PI * 2;
                        ctx.beginPath();
                        ctx.moveTo(Math.cos(ang) * a.size * 0.3, Math.sin(ang) * a.size * 0.3);
                        ctx.lineTo(Math.cos(ang) * a.size * 0.7, Math.sin(ang) * a.size * 0.7);
                        ctx.stroke();
                    }
                }
                ctx.restore();
            }

            // Bullets
            ctx.fillStyle = '#ffff00';
            for (const b of bullets) {
                ctx.globalAlpha = b.life;
                ctx.beginPath();
                ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            // Player
            const p = state.player;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle);
            ctx.globalAlpha = invincibleTimer > 0 ? (Math.sin(Date.now() * 0.02) * 0.4 + 0.6) : 1;
            // Ship body
            ctx.fillStyle = '#00cc00';
            ctx.beginPath();
            ctx.moveTo(0, -18);
            ctx.lineTo(-12, 14);
            ctx.lineTo(12, 14);
            ctx.closePath();
            ctx.fill();
            // Cockpit
            ctx.fillStyle = '#0099ff';
            ctx.beginPath();
            ctx.arc(0, -4, 4, 0, Math.PI * 2);
            ctx.fill();
            // Thrust flame
            if (p.thrusting) {
                ctx.fillStyle = '#ff6600';
                ctx.globalAlpha = 0.7 + Math.random() * 0.3;
                ctx.beginPath();
                ctx.moveTo(-6, 14);
                ctx.lineTo(6, 14);
                ctx.lineTo(0, 28 + Math.random() * 10);
                ctx.closePath();
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.restore();
        }

        function loop(ts) {
            if (!gameRunning) return;
            const dt = Math.min(ts - lastTime, 50);
            lastTime = ts;
            update(dt);
            draw();
            animId = requestAnimationFrame(loop);
        }

        function startGame() {
            if (animId) cancelAnimationFrame(animId);
            initGame();
            document.getElementById('gameOver').style.display = 'none';
            gameRunning = true;
            lastTime = performance.now();
            animId = requestAnimationFrame(loop);
            SDK.gameplayStart();
        }

        function endGame() {
            gameRunning = false;
            if (animId) cancelAnimationFrame(animId);
            SDK.gameplayStop();
            document.getElementById('finalScore').textContent = state.score;
            document.getElementById('finalHighScore').textContent = highScore;
            document.getElementById('gameOver').style.display = 'block';
        }

        // Input
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
            if (!gameRunning && (e.code === 'Enter' || e.code === 'Space')) startGame();
        });
        window.addEventListener('keyup', e => { keys[e.code] = false; });

        document.getElementById('restartBtn').addEventListener('click', startGame);
        document.getElementById('muteBtn').addEventListener('click', () => {
            isMuted = !isMuted;
            document.getElementById('muteBtn').textContent = isMuted ? 'UNMUTE' : 'MUTE';
        });

        // Init
        initStars();
        initAudio();
        SDK.init().then(() => startGame());
    })();
    </script>
</body>
</html>
